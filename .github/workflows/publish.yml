name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  minimum_flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install minimum supported Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
      - name: Install package dependencies
        run: flutter pub get --no-example
      - name: Analyze and test package
        run: flutter analyze --no-pub lib test && flutter test --no-pub

  build:
    needs: minimum_flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check tag matches package version
        run: |
          test "$RELEASE_TAG" = "$(sed -n 's/^version: //p' pubspec.yaml)"
      - name: Analyze and test package
        run: flutter analyze && flutter test
      - name: Analyze and test example
        working-directory: example
        run: flutter analyze && flutter test
      - name: Analyze and test mock data
        working-directory: packages/swifty_chat_mocked_data
        run: flutter analyze && flutter test
      - name: Check Publish Warnings
        run: dart pub publish --dry-run
      - name: Publish
        env:
          CREDENTIAL_JSON: ${{ secrets.CREDENTIAL_JSON }}
        run: |
          test -n "$CREDENTIAL_JSON"
          install -d -m 700 "$HOME/.config/dart"
          credential_path="$HOME/.config/dart/pub-credentials.json"
          trap 'rm -f "$credential_path"' EXIT
          umask 077
          printf '%s' "$CREDENTIAL_JSON" > "$credential_path"
          flutter pub publish --force
