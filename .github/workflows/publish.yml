name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  minimum_flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install minimum supported Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
      - name: Install package dependencies
        run: flutter pub get --no-example
      - name: Analyze and test package
        run: flutter analyze --no-pub lib test && flutter test --no-pub

  build:
    needs: minimum_flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check tag matches package version
        run: |
          test "$GITHUB_REF_NAME" = "$(sed -n 's/^version: //p' pubspec.yaml)"
      - name: Analyze and test package
        run: flutter analyze && flutter test
      - name: Analyze and test example
        working-directory: example
        run: flutter analyze && flutter test
      - name: Analyze and test mock data
        working-directory: packages/swifty_chat_mocked_data
        run: flutter analyze && flutter test
      - name: Check Publish Warnings
        run: dart pub publish --dry-run
      - name: Configure pub.dev authentication
        uses: dart-lang/setup-dart@v1
      - name: Publish
        run: flutter pub publish --force

  github_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "swifty_chat $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
